<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa</title>
    <link rel="stylesheet" href="index.css">
    <link rel="icon" href="./img/album.png" type="image/x-icon">
    <style>
        body {
            background-image: url('./img/back2.avif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #292786;
            font-family: 'Press Start 2P', Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .pesquisa-section {
            width: 98vw;
            max-width: 1100px;
            margin: 48px auto 32px auto;
            padding: 40px 24px;
            background: rgba(255,255,255,0.96);
            border-radius: 18px;
            box-shadow: 0 4px 24px #007bff22, 0 2px 8px #ffb30033;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .pesquisa-title {
            color: #1c649f;
            font-size: 2em;
            margin-bottom: 32px;
            text-align: center;
            letter-spacing: 2px;
            text-shadow: 1px 1px 8px #fff70033;
        }
        iframe {
            width: 100%;
            min-height: 600px;
            border: none;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 2px 8px #007bff22;
        }
        .back-button {
            margin: 32px auto 0 auto;
            padding: 12px 32px;
            font-size: 1.1em;
            color: white;
            background-color: #292786;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            transition: background 0.2s;
            display: block;
        }
        .back-button:hover {
            background-color: #1f1d7c;
        }
        @media (max-width: 900px) {
            .pesquisa-section {
                padding: 16px 2vw;
                margin: 18px 0 18px 0;
            }
            iframe {
                min-height: 400px;
            }
            .pesquisa-title {
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body>
    <section class="pesquisa-section">
        <div class="pesquisa-title">Pesquisa gamer</div>
        <iframe src="https://forms.gle/b8pB67sHdut8sRWP7" title="Pesquisa"></iframe>
        <button class="back-button" onclick="window.history.back();">Voltar</button>
    </section>
    <audio autoplay loop controls>
        <source src="./music/hoje nao tera gamer over.mp3" type="audio/mp3">
        Seu navegador não suporta o elemento de áudio.
    </audio>
</body>
</html>
