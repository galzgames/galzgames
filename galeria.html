     crossorigin="anonymous"></script>
    <style>
        body {
            background-image: url('./img/back2.avif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #fff;
            font-family: 'Press Start 2P', Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .back-button {
            position: fixed;
            top: 16px;
            left: 16px;
            padding: 10px 24px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            z-index: 10;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            transition: background 0.2s;
        }
        .back-button:hover {
            background-color: #0056b3;
        }
        h1 {
            color: #fff;
            margin-top: 80px;
            font-size: 2.2em;
            text-shadow: 2px 2px 8px #000;
            letter-spacing: 2px;
        }
        .gallery-section {
            padding: 32px 24px;
            background-color: rgba(255,255,255,0.92);
            border-radius: 18px;
            margin: 32px auto;
            max-width: 1400px;
            width: 98vw;
            box-shadow: 0 4px 24px #007bff22, 0 2px 8px #ffb30033;
        }
        .gallery-section h2 {
            text-align: center;
            margin-bottom: 32px;
            color: #1c649f;
            font-size: 1.5em;
            letter-spacing: 1px;
        }
        .carousel-inner {
            border-radius: 18px;
            box-shadow: 0 4px 24px #ff004f88, 0 2px 8px #fff70055;
            background: #fff;
            max-width: 1100px;
            margin: 0 auto;
        }
        .carousel-item img {
            width: 100%;
            max-height: 70vh;
            object-fit: cover;
            border-radius: 18px;
            border: 6px solid #fff;
            box-shadow: 0 4px 24px #007bff22, 0 2px 8px #ffb30033;
            background: #fff;
            margin: 0 auto;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .carousel-item img:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 32px #ff004f88, 0 4px 16px #007bff55;
        }
        .carousel-control-prev-icon,
        .carousel-control-next-icon {
            filter: invert(1) drop-shadow(0 0 6px #000);
            width: 48px;
            height: 48px;
        }
        @media (max-width: 900px) {
            .gallery-section {
                padding: 10px 2vw;
                margin: 18px 0;
            }
            .carousel-inner {
                max-width: 98vw;
            }
            .carousel-item img {
                max-height: 45vh;
            }
            h1 {
                font-size: 1.2em;
                margin-top: 32px;
            }
        }
    </style>
</head>
