<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Galeria - Retro Gamer Day</title>
    <link rel="icon" href="./img/album.png" type="image/x-icon">
    <link rel="stylesheet" href="index.css">
    <style>
        :root{
            --bg: #0f1724;
            --card-bg: #ffffff;
            --accent: #1c649f;
            --muted: #6b7280;
            --frame-radius: 12px;
            --frame-border: 6px;
        }

        html,body{height:100%;margin:0;font-family:'Press Start 2P', Arial, sans-serif;background:var(--bg);color:#fff;}
        .page {
            min-height:100vh;
            display:flex;
            flex-direction:column;
            align-items:center;
            padding:28px 18px 64px;
            box-sizing:border-box;
            gap:18px;
        }

        .topbar{
            width:100%;
            max-width:1200px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:12px;
        }
        .back-button{
            background:var(--accent);
            color:#fff;
            border:none;
            padding:10px 18px;
            border-radius:10px;
            cursor:pointer;
            font-weight:700;
            text-decoration:none;
        }
        .title{
            text-align:center;
            flex:1;
            color:var(--card-bg);
            font-size:1.15rem;
            letter-spacing:1px;
        }

        .sections{
            width:100%;
            max-width:1200px;
            display:flex;
            flex-direction:column;
            gap:28px;
        }

        .gallery-card{
            background: linear-gradient(180deg,#fff 0%, #f7fbff 100%);
            border-radius:18px;
            padding:18px;
            box-shadow:0 10px 30px rgba(0,0,0,0.25);
            color: #0b2540;
        }

        .gallery-header{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:12px;
            margin-bottom:12px;
        }
        .gallery-header h2{ margin:0; font-size:1rem; color:var(--accent); }
        .gallery-grid{
            display:grid;
            grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
            gap:14px;
            align-items:center;
            justify-items:center;
        }

        .photo-frame{
            width:100%;
            height:260px;
            max-height:32vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#fff;
            border-radius:var(--frame-radius);
            padding:8px;
            box-sizing:border-box;
            border: var(--frame-border) solid #ffffff;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            overflow:hidden;
            cursor:zoom-in;
            transition: transform .18s ease, box-shadow .18s ease;
        }
        .photo-frame:hover{ transform: translateY(-6px); box-shadow:0 18px 40px rgba(0,0,0,0.22); }

        .photo-frame img{
            display:block;
            width:auto;
            height:100%;
            max-width:100%;
            object-fit:contain; /* mostra a imagem inteira */
            border-radius:8px;
        }

        /* Lightbox / fullscreen modal */
        .lb {
            position:fixed;
            inset:0;
            display:none;
            align-items:center;
            justify-content:center;
            background: rgba(0,0,0,0.92);
            z-index:99999;
            padding:20px;
        }
        .lb.show{ display:flex; }
        .lb img{
            max-width:95%;
            max-height:95%;
            object-fit:contain;
            border-radius:12px;
            box-shadow:0 20px 60px rgba(0,0,0,0.7);
        }
        .lb .close, .lb .nav {
            position:absolute;
            background:rgba(255,255,255,0.06);
            border:none;
            color:#fff;
            padding:10px 12px;
            border-radius:8px;
            cursor:pointer;
            font-weight:700;
            backdrop-filter: blur(4px);
        }
        .lb .close{ top:18px; right:18px; }
        .lb .nav.prev{ left:18px; top:50%; transform:translateY(-50%); }
        .lb .nav.next{ right:18px; top:50%; transform:translateY(-50%); }

        .meta { font-size:0.72rem; color:var(--muted); margin-top:8px; text-align:center; }

        @media (max-width:900px){
            .photo-frame{ height:180px; max-height:36vh; }
            .gallery-grid{ gap:10px; }
        }
        @media (max-width:480px){
            .photo-frame{ height:140px; }
            .topbar{ padding:0 6px; }
            .title{ font-size:0.95rem; }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="topbar">
            <a class="back-button" href="index.html">← Voltar</a>
            <div class="title">GALERIA - Retro Gamer Day</div>
            <div style="width:86px"></div>
        </div>

        <div class="sections">

            <section class="gallery-card" aria-labelledby="g1-title">
                <div class="gallery-header">
                    <h2 id="g1-title">Fotos 2024 - Ano 1</h2>
                </div>
                <div class="gallery-grid">
                    <div class="photo-frame"><img src="./img/rgd2024 (1).jpg" alt="RGD2024 1"></div>
                    <div class="photo-frame"><img src="./img/rgd2024 (2).jpg" alt="RGD2024 2"></div>
                    <div class="photo-frame"><img src="./img/rgd2024 (3).jpg" alt="RGD2024 3"></div>
                    <div class="photo-frame"><img src="./img/rgd2024 (4).jpg" alt="RGD2024 4"></div>
                    <div class="photo-frame"><img src="./img/rgd2024 (5).jpg" alt="RGD2024 5"></div>
                    <div class="photo-frame"><img src="./img/rgd2024 (6).jpg" alt="RGD2024 6"></div>
                    <div class="photo-frame"><img src="./img/rgd2024 (7).jpg" alt="RGD2024 7"></div>
                </div>
                <div class="meta">Clique na foto para ampliar</div>
            </section>

            <section class="gallery-card" aria-labelledby="g2-title">
                <div class="gallery-header">
                    <h2 id="g2-title">Fotos 2 - 2024</h2>
                </div>
                <div class="gallery-grid">
                    <div class="photo-frame"><img src="./img/carrosel 2/rgd2024 (1).jpeg" alt="RGD2024 B1"></div>
                    <div class="photo-frame"><img src="./img/carrosel 2/rgd2024 (2).jpeg" alt="RGD2024 B2"></div>
                    <div class="photo-frame"><img src="./img/carrosel 2/rgd2024 (3).jpeg" alt="RGD2024 B3"></div>
                    <div class="photo-frame"><img src="./img/carrosel 2/rgd2024 (4).jpeg" alt="RGD2024 B4"></div>
                    <div class="photo-frame"><img src="./img/carrosel 2/rgd2024 (5).jpeg" alt="RGD2024 B5"></div>
                    <div class="photo-frame"><img src="./img/carrosel 2/rgd2024 (6).jpeg" alt="RGD2024 B6"></div>
                </div>
                <div class="meta">Imagens enquadradas profissionalmente</div>
            </section>

            <section class="gallery-card" aria-labelledby="g3-title">
                <div class="gallery-header">
                    <h2 id="g3-title">Fotos 3 - 2025</h2>
                </div>
                <div class="gallery-grid" id="gallery-2025">
                    <div class="photo-frame"><img src="./img/retrogamerday2025 fotos/rgd2025 (1).jpeg" alt="RGD2025 1"></div>
                    <div class="photo-frame"><img src="./img/retrogamerday2025 fotos/rgd2025 (2).jpeg" alt="RGD2025 2"></div>
                    <div class="photo-frame"><img src="./img/retrogamerday2025 fotos/rgd2025 (3).jpeg" alt="RGD2025 3"></div>
                    <div class="photo-frame"><img src="./img/retrogamerday2025 fotos/rgd2025 (4).jpeg" alt="RGD2025 4"></div>
                    <div class="photo-frame"><img src="./img/retrogamerday2025 fotos/rgd2025 (5).jpeg" alt="RGD2025 5"></div>
                    <div class="photo-frame"><img src="./img/retrogamerday2025 fotos/rgd2025 (6).jpeg" alt="RGD2025 6"></div>
                    <div class="photo-frame"><img src="./img/retrogamerday2025 fotos/rgd2025 (7).jpeg" alt="RGD2025 7"></div>
                    <div class="photo-frame"><img src="./img/retrogamerday2025 fotos/rgd2025 (8).jpeg" alt="RGD2025 8"></div>
                    <div class="photo-frame"><img src="./img/retrogamerday2025 fotos/rgd2025 (9).jpeg" alt="RGD2025 9"></div>
                    <div class="photo-frame"><img src="./img/retrogamerday2025 fotos/rgd2025 (10).jpeg" alt="RGD2025 10"></div>
                    <div class="photo-frame"><img src="./img/retrogamerday2025 fotos/rgd2025 (11).jpeg" alt="RGD2025 11"></div>
                    <div class="photo-frame"><img src="./img/retrogamerday2025 fotos/rgd2025 (12).jpeg" alt="RGD2025 12"></div>
                    <div class="photo-frame"><img src="./img/retrogamerday2025 fotos/rgd2025 (13).jpeg" alt="RGD2025 13"></div>
                    <div class="photo-frame"><img src="./img/retrogamerday2025 fotos/rgd2025 (14).jpeg" alt="RGD2025 14"></div>
                    <div class="photo-frame"><img src="./img/retrogamerday2025 fotos/rgd2025 (15).jpeg" alt="RGD2025 15"></div>
                    <div class="photo-frame"><img src="./img/retrogamerday2025 fotos/rgd2025 (16).jpeg" alt="RGD2025 16"></div>
                    <div class="photo-frame"><img src="./img/retrogamerday2025 fotos/rgd2025 (17).jpeg" alt="RGD2025 17"></div>
                    <div class="photo-frame"><img src="./img/retrogamerday2025 fotos/rgd2025 (18).jpeg" alt="RGD2025 18"></div>
                    <div class="photo-frame"><img src="./img/retrogamerday2025 fotos/rgd2025 (19).jpeg" alt="RGD2025 19"></div>
                    <div class="photo-frame"><img src="./img/retrogamerday2025 fotos/rgd2025 (20).jpeg" alt="RGD2025 20"></div>
                    <div class="photo-frame"><img src="./img/retrogamerday2025 fotos/rgd2025 (21).jpeg" alt="RGD2025 21"></div>
                    <div class="photo-frame"><img src="./img/retrogamerday2025 fotos/rgd2025 (22).jpeg" alt="RGD2025 22"></div>
                    <div class="photo-frame"><img src="./img/retrogamerday2025 fotos/rgd2025 (23).jpeg" alt="RGD2025 23"></div>
                </div>
                <div class="meta">Todas as fotos exibidas inteiras e centralizadas</div>
            </section>

        </div>

        <!-- Lightbox -->
        <div class="lb" id="lightbox" aria-hidden="true">
            <button class="close" id="lb-close">Fechar ✕</button>
            <button class="nav prev" id="lb-prev">◀</button>
            <img id="lb-img" src="" alt="">
            <button class="nav next" id="lb-next">▶</button>
        </div>

    </div>

    <script>
        // Lightbox: abre imagem clicada, navega com setas e fecha com ESC / clique
        (function(){
            const frames = Array.from(document.querySelectorAll('.photo-frame img'));
            const lb = document.getElementById('lightbox');
            const lbImg = document.getElementById('lb-img');
            const closeBtn = document.getElementById('lb-close');
            const prevBtn = document.getElementById('lb-prev');
            const nextBtn = document.getElementById('lb-next');
            let idx = -1;

            function openAt(i){
                if(i<0 || i>=frames.length) return;
                idx = i;
                lbImg.src = frames[i].src;
                lbImg.alt = frames[i].alt || '';
                lb.classList.add('show');
                lb.setAttribute('aria-hidden','false');
                document.body.style.overflow = 'hidden';
            }
            function closeLB(){
                lb.classList.remove('show');
                lb.setAttribute('aria-hidden','true');
                lbImg.src = '';
                document.body.style.overflow = '';
            }
            function prev(){ openAt((idx-1+frames.length)%frames.length); }
            function next(){ openAt((idx+1)%frames.length); }

            frames.forEach((img,i)=>{
                img.addEventListener('click', ()=> openAt(i));
                img.style.touchAction = 'manipulation';
            });

            closeBtn.addEventListener('click', closeLB);
            prevBtn.addEventListener('click', prev);
            nextBtn.addEventListener('click', next);

            lb.addEventListener('click', (e)=>{
                if(e.target === lb) closeLB();
            });

            document.addEventListener('keydown', (e)=>{
                if(!lb.classList.contains('show')) return;
                if(e.key === 'Escape') closeLB();
                if(e.key === 'ArrowLeft') prev();
                if(e.key === 'ArrowRight') next();
            });
        })();
    </script>

</body>
</html>
